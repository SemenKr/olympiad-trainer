name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: olympiad_trainer_ci
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d olympiad_trainer_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint styles
        run: pnpm stylelint

      - name: Validate authored content
        run: pnpm content:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate disposable test database
        run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgresql://ci_test_user:ci_test_password@127.0.0.1:5432/olympiad_trainer_ci

      - name: Test
        run: pnpm test
        env:
          DATABASE_TEST_URL: postgresql://ci_test_user:ci_test_password@127.0.0.1:5432/olympiad_trainer_ci

      - name: Verify PostgreSQL integration coverage
        run: pnpm test:integration
        env:
          DATABASE_TEST_URL: postgresql://ci_test_user:ci_test_password@127.0.0.1:5432/olympiad_trainer_ci

      - name: Build
        run: pnpm build

      - name: Verify metadata
        run: pnpm test:metadata
